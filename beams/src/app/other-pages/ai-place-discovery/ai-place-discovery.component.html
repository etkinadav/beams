<div class="apd-root" [attr.dir]="isRTL ? 'rtl' : 'ltr'">
  <div #mapContainer class="apd-map-canvas"></div>

  <div class="apd-config-blocker" *ngIf="!maptilerConfigured">
    <p>Add <code>maptilerApiKey</code> in <code>beams/src/environments/environment.ts</code> (MapTiler Cloud key).</p>
  </div>

  <div class="apd-config-blocker" *ngIf="maptilerConfigured && mapsLoadError">
    <p>{{ mapsLoadError }}</p>
  </div>

  <button
    mat-fab
    color="primary"
    type="button"
    class="apd-btn-locate"
    (click)="useMyLocation()"
    [disabled]="locationLoading || !maptilerConfigured"
    [attr.aria-label]="'Use my location'"
  >
    <mat-icon>{{ locationLoading ? "hourglass_empty" : "my_location" }}</mat-icon>
  </button>

  <div class="apd-bottom" *ngIf="maptilerConfigured">
    <mat-progress-bar *ngIf="searchLoading" mode="indeterminate" class="apd-progress"></mat-progress-bar>
    <div class="apd-error-line" *ngIf="searchError">{{ searchError }}</div>
    <div class="apd-bottom-row">
      <input
        class="apd-input"
        type="text"
        [(ngModel)]="prompt"
        placeholder="e.g. café nearby"
        (keydown.enter)="search()"
        [disabled]="searchLoading"
      />
      <button mat-raised-button color="primary" type="button" (click)="search()" [disabled]="searchLoading || locationLoading">
        Search
      </button>
    </div>
  </div>
</div>
