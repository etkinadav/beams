<div class="fill-height d-flex justify-content-center">
  <div class="d-flex w-100 flex-grow-1 position-relative">
    <div class="d-flex flex-column position-absolute w-100 h-100 overflow-auto">

      <!-- ========================== SCROLL AREA ========================== -->
      <div class="d-flex flex-column px-lg-big-landbot">

        <h4 class="py-0 px-1 m-0 d-flex pb-2 pb-md-4 pt-md-3">
          <b>
            LANDBOT FOR EAZIX
          </b>
        </h4>

        <!-- ========================== CONTENT AREA ========================== -->
        <div class="w-100 flex-grow-1 d-flex">
          <div class="d-flex flex-column w-100 gap-3" style="max-width: 600px;">
            
            <!-- User ID Input -->
            <div>
              <label for="userIdInput" class="d-block mb-2 fw-bold">User ID</label>
              <input 
                type="text" 
                id="userIdInput"
                class="form-control"
                [(ngModel)]="userId"
                placeholder="Enter User ID"
                required>
            </div>

            <!-- Message Input -->
            <div>
              <label for="messageInput" class="d-block mb-2 fw-bold">Message</label>
              <textarea 
                id="messageInput"
                class="form-control"
                [(ngModel)]="message"
                placeholder="Enter your message"
                rows="4"
                required></textarea>
            </div>

            <!-- Send Button -->
            <button 
              type="button"
              mat-raised-button 
              color="primary" 
              (click)="sendMessage()"
              [disabled]="isSending || !userId || !message"
              class="w-100">
              <span *ngIf="!isSending">Send Message</span>
              <span *ngIf="isSending">Sending...</span>
            </button>

            <!-- Success/Error Messages -->
            <div *ngIf="successMessage" class="alert alert-success mt-3" role="alert">
              {{ successMessage }}
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger mt-3" role="alert">
              {{ errorMessage }}
            </div>

          </div>
        </div>
        <!-- // ========================== CONTENT AREA ========================== -->

      </div>
      <!-- // ========================== SCROLL AREA ========================== -->

    </div>
  </div>
</div>
