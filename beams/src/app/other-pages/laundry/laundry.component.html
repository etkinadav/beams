<div class="laundry-container">
  <div class="laundry-content">
    <img src="assets/images/logo/laundry-logo.png" alt="Laundry Logo" class="laundry-logo">
    <h1 class="laundry-title">{{ "laundry.title" | translate }}</h1>
    
    <p class="laundry-intro">
      {{ "laundry.intro" | translate }}
    </p>
    
    <button class="laundry-button" (click)="onGetStartedClick()">
      {{ "laundry.button-text" | translate }}
    </button>
    
    <div class="laundry-process-section">
      <h2 class="process-title">{{ "laundry.process-title" | translate }}</h2>
      <p class="process-text">
        {{ "laundry.process-text" | translate }}
      </p>
    </div>
    
    <div class="laundry-service-section">
      <h2 class="service-title">{{ "laundry.service-title" | translate }}</h2>
      <p class="service-text">
        {{ "laundry.service-text" | translate }}
      </p>
    </div>
  </div>
</div>
