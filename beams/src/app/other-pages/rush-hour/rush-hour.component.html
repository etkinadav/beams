<div class="rush-hour-container">
  <div class="rush-hour-content">
    <h1 class="game-title">Rush Hour Puzzle</h1>
    <p class="game-instructions">Move the red car to the exit on the right side!</p>
    
    <div class="game-controls">
      <button class="reset-btn" (click)="resetGame()">Reset Game</button>
    </div>

    <div class="game-board-wrapper">
      <div class="game-board" (click)="onGridClick()" #gameBoard>
        <!-- Grid background -->
        <div class="grid-background">
          <ng-container *ngFor="let row of [0,1,2,3,4,5]">
            <div class="grid-cell-inner" *ngFor="let col of [0,1,2,3,4,5]"></div>
          </ng-container>
        </div>

        <!-- Exit indicator on row 3 (row index 2) -->
        <div class="exit-indicator" style="position: absolute; right: -40px; top: 120px; width: 30px; height: 60px; border: 2px dashed #4CAF50; display: flex; align-items: center; justify-content: center; color: #4CAF50; font-weight: bold;">EXIT</div>

        <!-- Vehicles -->
        <div 
          *ngFor="let vehicle of vehicles"
          class="vehicle"
          [ngStyle]="getVehicleStyle(vehicle)"
          (click)="onVehicleClick(vehicle.id); $event.stopPropagation()"
          [title]="vehicle.id">
        </div>

        <!-- Movement arrows (only for selected vehicle) -->
        <div *ngIf="selectedVehicleId">
          <ng-container *ngIf="getSelectedVehicle() as selectedVehicle">
            <!-- Left arrow (for horizontal vehicles) -->
            <div 
              *ngIf="selectedVehicle.orientation === 'H' && canMoveLeft(selectedVehicle, buildOccupancyGrid())"
              class="arrow arrow-left"
              [ngStyle]="getArrowStyle(selectedVehicle, 'left')"
              (click)="onArrowClick($event, 'left')">
              ←
            </div>
            
            <!-- Right arrow (for horizontal vehicles) -->
            <div 
              *ngIf="selectedVehicle.orientation === 'H' && canMoveRight(selectedVehicle, buildOccupancyGrid())"
              class="arrow arrow-right"
              [ngStyle]="getArrowStyle(selectedVehicle, 'right')"
              (click)="onArrowClick($event, 'right')">
              →
            </div>
            
            <!-- Up arrow (for vertical vehicles) -->
            <div 
              *ngIf="selectedVehicle.orientation === 'V' && canMoveUp(selectedVehicle, buildOccupancyGrid())"
              class="arrow arrow-up"
              [ngStyle]="getArrowStyle(selectedVehicle, 'up')"
              (click)="onArrowClick($event, 'up')">
              ↑
            </div>
            
            <!-- Down arrow (for vertical vehicles) -->
            <div 
              *ngIf="selectedVehicle.orientation === 'V' && canMoveDown(selectedVehicle, buildOccupancyGrid())"
              class="arrow arrow-down"
              [ngStyle]="getArrowStyle(selectedVehicle, 'down')"
              (click)="onArrowClick($event, 'down')">
              ↓
            </div>
          </ng-container>
        </div>
      </div>
    </div>

    <!-- Win modal -->
    <div class="win-modal" *ngIf="gameWon">
      <div class="win-content">
        <h2>🎉 Congratulations! 🎉</h2>
        <p>You solved the puzzle!</p>
        <p class="win-message">You unlocked the gift!</p>
        <button class="reset-btn" (click)="resetGame()">Play Again</button>
      </div>
    </div>
  </div>
</div>
